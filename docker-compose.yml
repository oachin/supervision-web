services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.secrets
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supervision}
      POSTGRES_DB: ${POSTGRES_DB:-supervision}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supervision}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - .env.secrets
    command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  websec:
    build:
      context: .
      dockerfile: services/websec-bridge/Dockerfile.standalone
    restart: unless-stopped
    env_file:
      - .env.secrets
    environment:
      AUDIT_DB_URL: sqlite:////data/audit.db
      AUDIT_ENGINE_WORKERS: "4"
      AUDIT_MIN_CONFIDENCE: confirmed
      AUDIT_VERIFY_BACKPORTS: "true"
      # WEBSEC_API_KEY and optional NVD_API_KEY come from .env.secrets
    volumes:
      - websec_data:/data
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      websec:
        condition: service_started
    env_file:
      - .env.secrets
    environment:
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      FRONTEND_INTERNAL_URL: http://frontend:3000
      WEBSEC_URL: http://websec:8000
      # WEBSEC_API_KEY from .env.secrets
    networks:
      - internal
      - public

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - public
      - internal

volumes:
  postgres_data:
  redis_data:
  websec_data:

networks:
  internal:
    internal: true
  public:
