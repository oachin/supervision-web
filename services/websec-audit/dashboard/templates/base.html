<!DOCTYPE html>
<html lang="{{ lang }}" class="bg-slate-100">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t.app_title }}{% endblock %}</title>
  <!-- Self-hosted assets only (no runtime CDN); all JS is external so the app
       runs under a strict Content-Security-Policy (script-src 'self'). -->
  <script src="{{ url_for('static', path='js/theme-init.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <style>
    .report-fmt-btn{ flex:1; text-align:center; font-size:11px; font-weight:600;
      letter-spacing:.04em; padding:4px 0; border-radius:7px; text-decoration:none;
      color:var(--rail-muted,#94a3b8); border:1px solid rgba(148,163,184,.22);
      transition:background .15s,color .15s,border-color .15s; }
    .report-fmt-btn:hover{ background:rgba(148,163,184,.12); color:#fff; }
    .report-fmt-btn-pdf{ color:#fca5a5; border-color:rgba(248,113,113,.4); }
    .report-fmt-btn-pdf:hover{ background:rgba(248,113,113,.16); color:#fff; }
  </style>
  <script src="{{ url_for('static', path='vendor/htmx.min.js') }}"></script>
  <script src="{{ url_for('static', path='vendor/chart.umd.min.js') }}"></script>
  <script src="{{ url_for('static', path='js/app.js') }}"></script>
</head>
{% set path = request.url.path %}
<body class="text-slate-800 min-h-screen md:flex">

  <!-- Left console rail (always dark, EASM control-plane feel) -->
  <aside class="app-rail hidden md:flex flex-col shrink-0">
    <a href="/" class="brand flex items-center gap-2.5 px-5 h-16 shrink-0">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 4 5v6c0 5 3.5 8 8 11 4.5-3 8-6 8-11V5l-8-3Z"/>
          <path d="M12 7v5l3 2"/>
        </svg>
      </span>
      <span class="leading-tight">
        <span class="brand-name block">{{ t.app_title }}</span>
        <span class="brand-tag block">ATTACK SURFACE MONITOR</span>
      </span>
    </a>

    <nav class="rail-nav flex-1 px-3 py-4 space-y-1">
      <a href="/" class="nav-link {% if path == '/' %}active{% endif %}">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span>{{ t.nav_dashboard }}</span>
      </a>
      <a href="/report/global?fmt=html&lang={{ lang }}" class="nav-link {% if '/report' in path %}active{% endif %}">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h8M8 9h2"/></svg>
        <span>{{ t.nav_global_report }}</span>
      </a>
      <div class="flex gap-2 px-3 pt-1">
        <a href="/report/global?fmt=html&lang={{ lang }}" class="report-fmt-btn">HTML</a>
        <a href="/report/global?fmt=pdf&lang={{ lang }}" class="report-fmt-btn report-fmt-btn-pdf">PDF</a>
      </div>
    </nav>

    <div class="rail-foot px-5 py-4 text-[11px]">
      <div class="flex items-center gap-2">
        <span class="live-dot"></span>
        <span class="uppercase tracking-wider">Live monitoring</span>
      </div>
    </div>
  </aside>

  <!-- Main column -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="topbar sticky top-0 z-30 flex items-center gap-3 px-4 h-16">
      <a href="/" class="md:hidden flex items-center gap-2 font-bold">
        <span class="brand-mark brand-mark-sm" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.5 8 8 11 4.5-3 8-6 8-11V5l-8-3Z"/></svg>
        </span>
        <span class="text-sm">{{ t.app_title }}</span>
      </a>
      <nav class="md:hidden flex gap-3 text-sm text-slate-500">
        <a href="/" class="hover:text-slate-900">{{ t.nav_dashboard }}</a>
        <a href="/report/global?fmt=html&lang={{ lang }}" class="hover:text-slate-900">{{ t.nav_global_report }}</a>
      </nav>

      <div class="ml-auto flex items-center gap-3">
        {% if authed %}
        <form method="post" action="/logout" class="inline">
          <button type="submit" class="topbar-btn text-sm">{{ t.logout }}</button>
        </form>
        {% endif %}
        <div class="seg flex items-center text-xs font-semibold">
          <a href="{{ url_en }}" class="{% if lang == 'en' %}on{% endif %}">EN</a>
          <a href="{{ url_fr }}" class="{% if lang == 'fr' %}on{% endif %}">FR</a>
        </div>
        <button id="themeToggle" type="button" title="{{ t.theme_toggle }}" aria-label="{{ t.theme_toggle }}"
                class="topbar-btn w-9 h-9 flex items-center justify-center">
          <svg class="dark:hidden" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
          <svg class="hidden dark:inline" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main class="w-full mx-auto px-4 md:px-6 py-6 flex-1 max-w-[1400px]">
      {% block content %}{% endblock %}
    </main>
    <footer class="mx-auto px-6 py-8 text-xs text-slate-400 max-w-[1400px] w-full">
      {{ t.footer }}
    </footer>
  </div>
</body>
</html>
